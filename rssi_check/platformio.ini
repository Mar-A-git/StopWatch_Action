; rssi_check: 受信レベル（RSSI）の実験機（かめはめ波の準備）
; 親機（左手）と子機（右手）は同じプログラム。ROLE_PARENT だけ変えてビルドする
;   親機に書く: PlatformIO の「env:oya」を選んで Upload
;   子機に書く: 「env:ko」を選んで Upload
; ボードの設定は M5Stack StopWatch（C152）用

[env]
platform = espressif32@6.12.0
board = esp32s3box
framework = arduino

; 16MB Flash / OPI-PSRAM
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200

lib_deps =
    m5stack/M5Unified@^0.2.28
    m5stack/M5GFX@^0.2.35

[env:oya]
build_flags =
    ${env.build_flags}
    -DROLE_PARENT=1

[env:ko]
build_flags =
    ${env.build_flags}
    -DROLE_PARENT=0
