; stackchan_watch
; 起動時のメニューで、スタックチャン時計・かめはめ波（左・右）・自分のモード（空き）を選ぶ
;
; 書き込み: PlatformIO の Upload（プログラム）と Upload Filesystem Image（声）
; かめはめ波の親機・子機は、書き込む時ではなくメニューで選ぶ（2台とも同じものを書き込む）
;
; ⚠ フォルダの場所（パス）に日本語などが入っていると、最後のリンクで
;   「cannot open map file」と出て失敗することがある。その時は、下の [platformio] の
;   build_dir のコメントを外して、英字だけの場所を指定する（例: C:/pio_build/stackchan_watch）
;
; [platformio]
; build_dir = C:/pio_build/stackchan_watch

[env:stopwatch]
platform = espressif32@6.12.0
board = esp32s3box
framework = arduino

; 16MB Flash / OPI-PSRAM。区画は partitions.csv（声用のファイル区画を約10.9MB に広げている）
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200

lib_deps =
    m5stack/M5Unified@^0.2.28
    m5stack/M5GFX@^0.2.35
